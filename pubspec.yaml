name: questmate
description: QuestMate - Habit & Quest Todo App (Hive + Firebase Sync)
publish_to: "none"



version: 1.0.0+1

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^3.0.7
  table_calendar: ^3.1.2
  lottie: ^3.1.0

  firebase_core: ^3.10.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.10.4

flutter:

  uses-material-design: true

  assets:
    - assets/animations/
